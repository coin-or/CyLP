name: Documentation

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # Cancel previous runs of this workflow for the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Cbc
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-libcbc-dev pkg-config

      - name: Install CyLP and Sphinx
        run: python -m pip install . "sphinx~=9.2"

      # Sphinx imports CyLP to read the docstrings. Run it from cylp/doc so
      # that it imports the installed package.
      - name: Build the documentation
        working-directory: cylp/doc
        run: python -m sphinx -b html -W --keep-going source build/html

      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: cylp/doc/build/html

  # Publish the documentation on https://www.coin-or.org/CyLP/ for each
  # release, or when the workflow is started by hand on master
  deploy:
    needs: build
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove the old documentation
        run: git rm -rq --ignore-unmatch .

      - uses: actions/download-artifact@v8
        with:
          name: documentation

      - name: Push the new documentation
        run: |
          # GitHub Pages would otherwise use Jekyll and skip the _static directory
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "The documentation hasn't changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Documentation for ${{ github.event.release.tag_name || github.sha }}"
          git push
