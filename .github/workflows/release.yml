---
name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      # Use a personal access token, not GITHUB_TOKEN, so that publishing the
      # release triggers the workflow that builds and uploads the wheels
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.TKRALPHS_RELEASE }}
        run: >
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
          --verify-tag --title "Release $GITHUB_REF_NAME" --generate-notes
