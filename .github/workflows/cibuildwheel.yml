name: Build and upload to PyPI
# taken from https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml

# Build on every branch push, tag push, and pull request change:
# on: [push, pull_request]
# Alternatively, to publish when a (published) GitHub Release is created, use the following:
on:
  #push:
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  # Cancel previous runs of this workflow for the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64,  os: ubuntu-latest,    arch: x86_64,  build: "*-manylinux_*" }
          - { name: musllinux-x86_64,  os: ubuntu-latest,    arch: x86_64,  build: "*-musllinux_*" }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, arch: aarch64, build: "*-manylinux_*" }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, arch: aarch64, build: "*-musllinux_*" }
          - { name: macos-x86_64,      os: macos-15-intel,   arch: x86_64,  build: "*" }
          - { name: macos-arm64,       os: macos-latest,     arch: arm64,   build: "*" }
          # Must match the runner image the Cbc MSVC release binaries were built on
          - { name: windows-amd64,     os: windows-2025,     arch: AMD64,   build: "*" }
    env:
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_BUILD: ${{ matrix.build }}

    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: cibuildwheel-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibuildwheel-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cylp
    permissions:
      id-token: write

    # upload to PyPI on every tag starting with 'v'
    # if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    # alternatively, to publish when a GitHub Release is created, use the following rule:
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "cibuildwheel-*"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1


  upload_release_assets:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release'}}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "cibuildwheel-*"
          path: dist
          merge-multiple: true

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber -R "${{ github.repository }}"
